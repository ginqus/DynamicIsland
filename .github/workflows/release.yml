name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=$($env:TAG.TrimStart('v'))
          -o out

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "+refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          $notes = @()
          if ((git cat-file -t $env:TAG) -eq 'tag') { $notes = @(git tag -l --format='%(contents)' $env:TAG) }
          if ("$notes".Trim()) {
            $notes | Set-Content notes.md -Encoding utf8
            gh release create $env:TAG out/DynamicIsland.exe --title "Dynamic Island $env:TAG" --notes-file notes.md
          } else {
            gh release create $env:TAG out/DynamicIsland.exe --title "Dynamic Island $env:TAG" --generate-notes
          }
